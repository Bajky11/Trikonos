name: trikonos-production

services:
  frontend:
    build:
      context: ./frontend2
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in .env.production}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    networks:
      frontend: {}
      cloudflare:
        aliases:
          - trikonos-frontend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trikonos}
      POSTGRES_USER: ${POSTGRES_USER:-trikonos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  backend:
    build:
      context: ./backend
      target: production
    init: true
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env.production}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env.production}
      DB_NAME: ${POSTGRES_DB:-trikonos}
      DB_USER: ${POSTGRES_USER:-trikonos}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      DB_HOST: db
      DB_PORT: "5432"
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Set FRONTEND_ORIGINS in .env.production}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@example.com}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/config', headers={'Host': 'localhost', 'X-Forwarded-Proto': 'https'}), timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      backend:
        aliases:
          - trikonos-backend

  backend-proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:80"
    volumes:
      - ./deploy/backend.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      backend: {}
      cloudflare:
        aliases:
          - trikonos-backend-proxy

volumes:
  postgres_data:
  static_data:
  media_data:

networks:
  frontend:
  backend:
  cloudflare:
    external: true
    name: ${CLOUDFLARE_NETWORK:-bajerlukascz_network}
