# Internal HTTP hop AFTER a trusted, TLS-terminating reverse proxy.
# Compose publishes this listener on loopback only. Do not expose it publicly.
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /srv/static/;
        expires 1h;
    }

    location /media/ {
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        # Overwrite, never trust a client-provided X-Forwarded-Proto.
        # The public HTTPS connection is terminated before this internal hop.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
