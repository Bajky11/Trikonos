server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Missing assets must return 404 rather than the SPA document.
    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # React Router: direct links and refreshes also load the SPA.
    # Deliberately no API/backend proxy here.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
